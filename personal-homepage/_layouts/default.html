<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title | default: site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">跳转到正文</a>
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <a href="https://github.com/MikeIsCyprinusCarpio">GitHub ↗</a>
    </header>
    <main id="content" tabindex="-1">{{ content }}</main>
    <footer>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</footer>
  </body>
</html>
